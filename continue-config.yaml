# Continue (VS Code) config for ParleyAI
# Copy this file to ~/.continue/config.yaml and adjust the values below.
#
# 1. Set YOUR_MODEL to the model family running on your ParleyAI backend
#    (check: curl http://localhost:8000/v1/models → data[0].id)
# 2. Set apiBase to localhost or your tunnel URL + /v1
# 3. ctx_text in backend/.env must be >= contextLength below (restart backend after changing)
#
# Docs: https://docs.continue.dev/reference/

name: ParleyAI
version: 1.0.0
schema: v1

models:
  # Chat, edit, and apply (main coding assistant)
  # chat  = conversation panel
  # edit  = inline edits (select code → prompt)
  # apply = writes suggested changes to files
  # Agent/Plan modes won't work (need tool_use); the warning in VS Code can be ignored.
  - name: ParleyAI Chat
    provider: openai
    model: Qwen2.5-Coder-14B-Instruct          # ← your model_family_text
    apiBase: http://localhost:8000/v1            # ← or https://YOUR-TUNNEL.trycloudflare.com/v1
    apiKey: parley                               # any non-empty string; ParleyAI ignores it
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 16384                       # ← must match ctx_text in backend/.env
      maxTokens: 4096
      temperature: 0.7

  # Tab autocomplete (inline code completions as you type)
  - name: ParleyAI Autocomplete
    provider: openai
    model: Qwen2.5-Coder-14B-Instruct          # ← same model
    apiBase: http://localhost:8000/v1
    apiKey: parley
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 16384
    autocompleteOptions:
      debounceDelay: 300
      maxPromptTokens: 2048
      onlyMyCode: true

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
